services:

  sglang:
    image: scitrera/dgx-spark-sglang:0.5.17
    command: >
      python3 -m sglang.launch_server --model-path ellamind/propella-1-4b --host 0.0.0.0 --port 8000 --context-length 65536 --max-running-requests 256 --chunked-prefill-size 8192 --enable-mixed-chunk --num-continuous-decode-steps 8 --grammar-backend llguidance --mem-fraction-static 0.7
    ports:
      - "8000:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    healthcheck:
          test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
          interval: 10s
          timeout: 5s
          retries: 30
          start_period: 30s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
    depends_on:
      - sglang
    volumes:
          - ./repos:/app/repos