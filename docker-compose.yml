services:

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - PYTHONUNBUFFERED=1
    depends_on:
      sglang:
        condition: service_healthy
    volumes:
          - ./repos:/app/repos